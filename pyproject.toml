[project]
name = "train-platform-backend"
version = "0.1.0"
description = "Train platform backend (v2 rewrite)"
readme = "README.md"
requires-python = ">=3.10, <3.11"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.29.0",
  "SQLAlchemy==2.0.30",
  "alembic==1.13.1",
  "pymysql==1.1.0",
  "python-dotenv==1.0.1",
  "python-multipart==0.0.9",
  "PyYAML==6.0.1",
  "pandas==2.2.2",
  "requests==2.32.3",
  "Pillow==10.4.0",
  "mlflow==2.15.1",

  # YOLO / PyTorch CUDA 11.8
  "torch==2.4.1",
  "torchvision==0.19.1",
  "ultralytics==8.4.14",

  # PaddlePaddle GPU for Windows CUDA 11.8
  # Paddle 官方 Windows CUDA 11.8 文档当前推荐 3.2.2。
  "paddlepaddle-gpu==3.2.2",

  # PaddleDetection 2.6.0 需要 numpy<1.24
  "numpy==1.23.5",

  # ultralytics 需要 opencv-python>=4.6；PaddleDetection 从本地源码 checkout 导入，
  # 不再安装 paddledet wheel，避免其旧 opencv 依赖约束。
  "opencv-python==4.9.0.80",

  # PaddleDetection release/2.6 源码运行依赖
  "pycocotools>=2.0.7",
  "typeguard>=2.13.3",
  "visualdl>=2.2.0",
  "lap>=0.5.12",
  "tqdm>=4.67.1",
  "shapely>=2.1.2",
  "pyclipper>=1.4.0",
  "scipy>=1.15.3",
  "scikit-learn>=1.7.2",
  "terminaltables>=3.1.10",

  "cryptography>=46.0.3",
  "onnxruntime-gpu>=1.23.2",
  "onnx<=1.16.0",
  "nuitka>=2.8.10",
  # PaddleDetection 2.6.0 imports pkg_resources.
  # setuptools 82+ no longer provides it, so keep setuptools on the last
  # compatible major line.
  "setuptools>=65,<81",
  "wheel>=0.46.3",

  # numpy==1.23.5 时，rasterio 不能用 >=1.4.4
  "rasterio>=1.3.10,<1.4.0",

  # PaddleDetection / Paddle 老生态更稳
  "protobuf<=3.20.3",

  # 不要放 >=0.64.0，容易继续拉新版 numpy 生态
  "numba>=0.59.0,<0.61",

  "motmetrics>=1.4.0",
  "psutil>=7.2.2",
  "nvidia-ml-py>=13.595.45",
  "cython>=3.2.4",
]

[tool.uv]
# 你只关心 Windows，就只解析 Windows。
# 这样不会再触发 Linux 下 torch/paddle 的 cudnn 冲突。
environments = [
  "sys_platform == 'win32'",
]

# 关键：统一使用 PaddleDetection 源码 checkout，不安装 paddledet wheel。
# 这里仍固定 opencv-python 4.9.0.80，以匹配 ultralytics 和当前推理/图像处理代码。
override-dependencies = [
  "opencv-python==4.9.0.80",
]

[tool.uvicorn]
factory = false

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "paddle-cu118"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu118/"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'win32'" },
]

torchvision = [
  { index = "pytorch-cu118", marker = "sys_platform == 'win32'" },
]

paddlepaddle-gpu = [
  { index = "paddle-cu118", marker = "sys_platform == 'win32'" },
]
