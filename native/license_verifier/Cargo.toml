[package]
name = "train-platform-license"
version = "0.1.0"
edition = "2021"

[lib]
name = "license"
crate-type = ["cdylib"]

[features]
default = []
enforce-license = []

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
ed25519-dalek = "2.1.1"
pyo3 = { version = "0.23.5", features = ["abi3-py310", "extension-module"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
